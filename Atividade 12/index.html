<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Atividade12</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Atividade 12 - Objetos em JavaScript</h1>

  <!-- Exercício 1 -->
  <div class="exercicio">
    <h2>Exercício 1 - Retângulo</h2>
    <label>Base: <input type="number" id="base" /></label><br>
    <label>Altura: <input type="number" id="altura" /></label><br>
    <button onclick="calcularArea()">Calcular Área</button>
    <p id="resultadoRetangulo"></p>
  </div>

  <!-- Exercício 2 - Corrente -->
  <div class="exercicio">
    <h2>Exercício 2 - Conta Corrente</h2>
    <label>Nome: <input type="text" id="c-nome" /></label><br>
    <label>Banco: <input type="text" id="c-banco" /></label><br>
    <label>Número da Conta: <input type="text" id="c-numero" /></label><br>
    <label>Saldo: <input type="number" id="c-saldo" /></label><br>
    <label>Saldo Especial: <input type="number" id="c-especial" /></label><br>
    <button onclick="criarCorrente()">Criar Conta Corrente</button>
    <p id="resultadoCorrente"></p>
  </div>

  <!-- Exercício 2 - Poupança -->
  <div class="exercicio">
    <h2>Exercício 2 - Poupança</h2>
    <label>Nome: <input type="text" id="p-nome" /></label><br>
    <label>Banco: <input type="text" id="p-banco" /></label><br>
    <label>Número da Conta: <input type="text" id="p-numero" /></label><br>
    <label>Saldo: <input type="number" id="p-saldo" /></label><br>
    <label>Juros (%): <input type="number" id="p-juros" /></label><br>
    <label>Data de Vencimento: <input type="date" id="p-vencimento" /></label><br>
    <button onclick="criarPoupanca()">Criar Poupança</button>
    <p id="resultadoPoupanca"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
